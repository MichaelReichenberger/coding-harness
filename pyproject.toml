[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supermarket-coding-harness"
version = "0.1.0"
description = "A local, contained Python coding harness for the small Supermarket Receipt Python project"
requires-python = ">=3.12"
dependencies = ["streamlit==1.65.0", "httpx==0.28.1", "pydantic==2.13.5"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: real Docker boundary tests (explicit --docker required)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
