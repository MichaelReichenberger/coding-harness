# Optional nach config.local.toml kopieren. Umgebungsvariablen haben Vorrang.
# Modellname ist frei wählbar; das Modell muss in Ollama installiert sein.
ollama_base_url = "http://127.0.0.1:11434"
model = "qwen2.5-coder:7b"
image = "docker.io/library/supermarket-harness:stage1"

[limits]
actions = 40
rounds = 50
retries = 2
check_seconds = 120
model_seconds = 180
output_bytes = 65536
file_bytes = 262144
context_bytes = 196608
artifact_bytes = 8388608
